<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="title.index">Muhammed Murad Chamaa</title>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <link rel="manifest" href="site.webmanifest"/>
  <meta name="theme-color" content="#1a130d"/>
  <style>
    /* ── the one typeface: a handwritten TTF, self-hosted ────────────────
       Shantell Sans covers Latin + Turkish + Cyrillic, so it serves every
       European language in the picker. CJK / Arabic / Devanagari / Bengali
       fall back to the system font (no single handwriting face covers
       those scripts — that is a font-technology limit, not a choice). */
    @font-face {
      font-family: 'Site Hand';
      src: url('assets/fonts/ShantellSans.ttf') format('truetype');
      font-weight: 300 800;
      font-style: normal;
      font-display: swap;
    }

    /* realistic water page: the global CRT scanlines would read as banding
       bands on a smooth gradient — disable them here */
    body::before { display: none; }

    /* ── /  main  — realistic pond ── */
    :root {
      --pg-bg:      #0a0e14;
      --pg-surface: rgba(10, 14, 20, .78);
      --pg-border:  #26405c;
      --pg-accent:  #ffc100;
      --pg-accent2: #ff8200;
      --pg-text:    #eee6c8;
      --pg-dim:     #5f6f80;
      --pg-glow:    rgba(255, 131, 0, .28);
    }

    #bgCanvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }

    /* arrangement per sketch 1: dotted outer frame = whole content area;
       welcome panel = TOP band anchored left (~2/3 wide);
       nav cells = RIGHTMOST column of the lower row (bottom-right). */
    .layout {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr 0.8fr;
      grid-template-rows: 1fr 1.15fr;
      gap: 22px;
      padding: 4vh 6vw 7.5vh 4.5vw;
    }
    .panel-col { display: contents; }

    /* welcome: bare handwritten text floating on the water — NO box,
       no border, no glow; separate from the window frames on other pages */
    .welcome-panel {
      grid-column: 1 / 3;
      grid-row: 1;
      align-self: start;
      padding: 6px 10px;
    }

    .panel-col > section:last-child {
      grid-column: 3;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* readable handwritten font for welcome + nav labels */
    .welcome {
      font-family: 'Site Hand', system-ui, sans-serif;
      font-size: clamp(60px, 8vw, 112px);
      line-height: 1;
      color: var(--pg-text);
      text-shadow: 0 2px 18px rgba(0,0,0,.5);
      user-select: none;
    }
    .welcome-sub { margin-top: 10px; font-size: 22px; color: var(--pg-dim); line-height: 1.4; }
    .welcome-sub b { font-weight: normal; color: var(--pg-text); }
    .welcome-hint {
      margin-top: 14px;
      font-size: 17px;
      color: rgba(95, 111, 128, .9);
      animation: hint-fade 3.5s ease-in-out infinite;
    }
    @keyframes hint-fade { 0%,100% { opacity: .45; } 50% { opacity: .95; } }

    .stack { display: flex; flex-direction: column; padding: 4px 0; }

    /* buttons: TEXT ONLY — no background, no border, no box */
    .stack a.cell {
      display: block;
      width: fit-content;
      padding: 4px 2px;
      background: none;
      border: none;
      box-shadow: none;
      text-decoration: none;
      transition: transform .12s steps(3);
    }
    .stack a.cell + a.cell { margin-top: 12px; }

    .stack a.cell .num   { display: none; }
    .stack a.cell .label {
      font-family: 'Site Hand', system-ui, sans-serif;
      font-size: 36px;
      line-height: 1.1;
      color: var(--pg-text);
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }

    .stack a.cell:hover { transform: translateX(6px); }
    .stack a.cell:hover .label { color: var(--pg-accent); }

    .layout::before { content: none; }
    .layout::after  { content: none; }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      .panel.welcome-panel { grid-column: 1; grid-row: 1; }
      .panel-col > section:last-child { grid-column: 1; grid-row: 2; }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- top bar intentionally removed on this page: navigation lives in the
       hand-write nav labels below; other pages keep the fixed site-nav -->

  <main class="layout">
    <div aria-hidden="true"></div><div aria-hidden="true"></div><div aria-hidden="true"></div><!-- grid filler -->

    <div class="panel-col">
      <section class="panel welcome-panel">
        <h1 class="welcome" data-i18n="index.welcome">welcome</h1>
        <p class="welcome-sub"><b>Muhammed Murad Chamaa</b><br/><span data-i18n="index.tagline">computer engineer · game dev · researcher</span></p>
        <p class="welcome-hint" data-i18n="index.hint">click the water — it hears you</p>
      </section>

      <section>
        <div class="stack">
          <a class="cell" href="about-me.html"><span class="num">01</span><span class="label" data-i18n="index.nav.about">about me</span></a>
          <a class="cell" href="game.html"><span class="num">02</span><span class="label" data-i18n="index.nav.game">game</span></a>
          <a class="cell" href="code.html"><span class="num">03</span><span class="label" data-i18n="index.nav.code">code</span></a>
        </div>
      </section>
    </div>
  </main>

<script src="assets/js/transitions.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/sfx.js"></script>
<script src="assets/js/bg-webgl.js"></script>
</body>
</html>
